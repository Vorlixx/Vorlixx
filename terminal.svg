<text x="28" y="278" class="ln" style="animation-delay:3.36s"><tspan fill="#00e5ff">[OK]</tspan><tspan fill="#c9d1d9"> status    : advanced ad-pentesting in progress</tspan></text>
<text x="28" y="304" class="ln" style="animation-delay:3.78s"><tspan fill="#00ff9c">└─$ </tspan><tspan fill="#e6f7ef">./resume_mission.sh</tspan></text>
