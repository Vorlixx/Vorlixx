<text x="28" y="122" class="ln" style="animation-delay:0.84s"><tspan fill="#7ee787">  &gt; kito</tspan><tspan fill="#9ec9b4"> — CyberSecurity Student // offensive security</tspan></text>
<text x="28" y="148" class="ln" style="animation-delay:1.26s"><tspan fill="#00ff9c">└─$ </tspan><tspan fill="#e6f7ef">./init_recon.sh --target=career</tspan></text>
<text x="28" y="174" class="ln" style="animation-delay:1.68s"><tspan fill="#7ee787">[+]</tspan><tspan fill="#c9d1d9"> focus     : recon · exploitation · reporting</tspan></text>
<text x="28" y="200" class="ln" style="animation-delay:2.1s"><tspan fill="#7ee787">[+]</tspan><tspan fill="#c9d1d9"> stack     : python · bash · powershell · go (learning)</tspan></text>
<text x="28" y="226" class="ln" style="animation-delay:2.52s"><tspan fill="#7ee787">[+]</tspan><tspan fill="#c9d1d9"> arsenal   : kali linux · burp suite · nmap · custom tooling</tspan></text>
