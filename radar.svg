<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace">
<defs>
<linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="225" y1="190" x2="343" y2="190">
<stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
<stop offset="1" stop-color="#00ff9c" stop-opacity="0.35"/>
</linearGradient>
<filter id="rg" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="2" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>
.sweep{transform-origin:225px 190px;animation:spin 4s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.blip{opacity:0;animation:blip 4s linear infinite}
@keyframes blip{0%,10%{opacity:0}14%{opacity:1}55%{opacity:0.25}80%,100%{opacity:0}}
.dot{animation:dot 1.4s ease-in-out infinite}
@keyframes dot{0%,100%{opacity:1}50%{opacity:0.2}}
.cur{animation:cur 1.05s steps(1) infinite}
@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
</defs>

<rect x="1" y="1" width="458" height="328" rx="14" fill="#0a0f14" stroke="#1c3a2c" stroke-width="1.5"/>

<text x="24" y="34" font-size="14" letter-spacing="2" fill="#00ff9c">⌖ LIVE RECON — SECTOR SCAN</text>
<circle cx="390" cy="29" r="4" fill="#ff2e63" class="dot"/>
<text x="400" y="33" font-size="11" fill="#ff88a5">REC</text>

<g stroke="#16463a" fill="none">
<circle cx="225" cy="190" r="118"/>
<circle cx="225" cy="190" r="78"/>
<circle cx="225" cy="190" r="39"/>
<line x1="107" y1="190" x2="343" y2="190"/>
<line x1="225" y1="72" x2="225" y2="308"/>
</g>

<g class="sweep">
<path d="M225,190 L343,190 A118,118 0 0 0 292.7,93.4 Z" fill="url(#trail)"/>
<line x1="225" y1="190" x2="343" y2="190" stroke="#00ff9c" stroke-width="2" filter="url(#rg)"/>
</g>

<circle cx="280" cy="140" r="4" fill="#00e5ff" filter="url(#rg)" class="blip"/>
<circle cx="170" cy="232" r="4" fill="#00e5ff" filter="url(#rg)" class="blip" style="animation-delay:1.3s"/>
<circle cx="258" cy="112" r="4" fill="#ff2e63" filter="url(#rg)" class="blip" style="animation-delay:2.6s"/>
<circle cx="225" cy="190" r="3" fill="#00ff9c" filter="url(#rg)"/>

<g stroke="#00ff9c" stroke-width="1.5" fill="none" opacity="0.8">
<path d="M16,32 V16 H32"/>
<path d="M444,32 V16 H428"/>
<path d="M16,298 V314 H32"/>
<path d="M444,298 V314 H428"/>
</g>

<text x="24" y="298" font-size="11" fill="#79d9b6">TGT-01 subdomain-recon-tool ▸ locked</text>
<text x="24" y="316" font-size="11" fill="#79d9b6">TGT-02 vuln_scanner ▸ tracking</text>
<text x="436" y="316" font-size="11" fill="#00e5ff" text-anchor="end" class="cur">SCANNING</text>
</svg>
