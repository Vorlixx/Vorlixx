<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace">
<defs>
<linearGradient id="barG" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#00b374"/>
<stop offset="1" stop-color="#00ff9c"/>
</linearGradient>
<filter id="sg" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="1.5" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>
.fill{transform-origin:150px 0px;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.b92{animation-name:k92;animation-duration:11s}
.b88{animation-name:k88;animation-duration:11s;animation-delay:0.25s}
.b85{animation-name:k85;animation-duration:11s;animation-delay:0.5s}
.b80{animation-name:k80;animation-duration:11s;animation-delay:0.75s}
.b78{animation-name:k78;animation-duration:11s;animation-delay:1s}
.b75{animation-name:k75;animation-duration:11s;animation-delay:1.25s}
.b55{animation-name:k55;animation-duration:11s;animation-delay:1.5s}
@keyframes k92{0%,10%{transform:scaleX(0)}55%{transform:scaleX(0.92)}85%{transform:scaleX(0.92)}100%{transform:scaleX(0)}}
@keyframes k88{0%,10%{transform:scaleX(0)}55%{transform:scaleX(0.88)}85%{transform:scaleX(0.88)}100%{transform:scaleX(0)}}
@keyframes k85{0%,10%{transform:scaleX(0)}55%{transform:scaleX(0.85)}85%{transform:scaleX(0.85)}100%{transform:scaleX(0)}}
@keyframes k80{0%,10%{transform:scaleX(0)}55%{transform:scaleX(0.80)}85%{transform:scaleX(0.80)}100%{transform:scaleX(0)}}
@keyframes k78{0%,10%{transform:scaleX(0)}55%{transform:scaleX(0.78)}85%{transform:scaleX(0.78)}100%{transform:scaleX(0)}}
@keyframes k75{0%,10%{transform:scaleX(0)}55%{transform:scaleX(0.75)}85%{transform:scaleX(0.75)}100%{transform:scaleX(0)}}
@keyframes k55{0%,10%{transform:scaleX(0)}55%{transform:scaleX(0.55)}85%{transform:scaleX(0.55)}100%{transform:scaleX(0)}}
.val{opacity:0;animation:val 11s ease-in-out infinite}
@keyframes val{0%,10%{opacity:0}20%{opacity:0.95}85%{opacity:0.95}100%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.9}50%{opacity:0.4}}
</style>
</defs>

<rect x="1" y="1" width="458" height="328" rx="14" fill="#0a0f14" stroke="#1c3a2c" stroke-width="1.5"/>

<text x="24" y="34" font-size="14" letter-spacing="2" fill="#00ff9c">⌁ SKILL MATRIX — LOADOUT</text>
<text x="436" y="34" font-size="11" fill="#3f6f5a" text-anchor="end">v2.6</text>

<g font-size="13" fill="#d6e9dc">
<text x="24" y="82">PYTHON</text>
<text x="24" y="116">LINUX / KALI</text>
<text x="24" y="150">BASH</text>
<text x="24" y="184">POWERSHELL</text>
<text x="24" y="218">WEB PENTEST</text>
<text x="24" y="252">BURP SUITE</text>
<text x="24" y="286">GO <tspan fill="#00e5ff" font-size="10">// learning</tspan></text>
</g>

<g>
<rect x="150" y="70" width="270" height="9" rx="4.5" fill="#0f231a"/>
<rect x="150" y="104" width="270" height="9" rx="4.5" fill="#0f231a"/>
<rect x="150" y="138" width="270" height="9" rx="4.5" fill="#0f231a"/>
<rect x="150" y="172" width="270" height="9" rx="4.5" fill="#0f231a"/>
<rect x="150" y="206" width="270" height="9" rx="4.5" fill="#0f231a"/>
<rect x="150" y="240" width="270" height="9" rx="4.5" fill="#0f231a"/>
<rect x="150" y="274" width="270" height="9" rx="4.5" fill="#0f231a"/>
</g>

<rect x="150" y="70" width="270" height="9" rx="4.5" fill="url(#barG)" filter="url(#sg)" class="fill b92"/>
<rect x="150" y="104" width="270" height="9" rx="4.5" fill="url(#barG)" filter="url(#sg)" class="fill b88"/>
<rect x="150" y="138" width="270" height="9" rx="4.5" fill="url(#barG)" filter="url(#sg)" class="fill b85"/>
<rect x="150" y="172" width="270" height="9" rx="4.5" fill="url(#barG)" filter="url(#sg)" class="fill b80"/>
<rect x="150" y="206" width="270" height="9" rx="4.5" fill="url(#barG)" filter="url(#sg)" class="fill b78"/>
<rect x="150" y="240" width="270" height="9" rx="4.5" fill="url(#barG)" filter="url(#sg)" class="fill b75"/>
<rect x="150" y="274" width="270" height="9" rx="4.5" fill="url(#barG)" filter="url(#sg)" class="fill b55"/>

<g font-size="12" fill="#7ff5c8" text-anchor="end">
<text x="430" y="82" class="val">92%</text>
<text x="430" y="116" class="val" style="animation-delay:0.25s">88%</text>
<text x="430" y="150" class="val" style="animation-delay:0.5s">85%</text>
<text x="430" y="184" class="val" style="animation-delay:0.75s">80%</text>
<text x="430" y="218" class="val" style="animation-delay:1s">78%</text>
<text x="430" y="252" class="val" style="animation-delay:1.25s">75%</text>
<text x="430" y="286" class="val" style="animation-delay:1.5s">55%</text>
</g>

<text x="24" y="316" font-size="11" fill="#79d9b6" class="pulse">[+] pipeline: recon → exploit → report · all systems nominal</text>
</svg>
