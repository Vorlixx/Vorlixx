<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,'Courier New',monospace">
<defs>
<linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#04070a"/>
<stop offset="1" stop-color="#081218"/>
</linearGradient>
<radialGradient id="vig" cx="0.5" cy="0.45" r="0.8">
<stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
<stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
</radialGradient>
<linearGradient id="titleG" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f2fff9"/>
<stop offset="1" stop-color="#6ff0c2"/>
</linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowS" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="1.4" result="b"/>
