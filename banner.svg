<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#111826"/>
    </linearGradient>
    <radialGradient id="glow" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.35"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1000" height="260" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>
    <rect width="1000" height="260" fill="url(#glow)"/>

    <!-- header bar -->
    <rect x="0" y="0" width="1000" height="42" fill="#0d1420"/>
    <rect x="0" y="41" width="1000" height="1" fill="#1f2937"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#64748b">
      <text x="28" y="26">scan_report.log</text>
    </g>
    <g transform="translate(0,0)">
      <circle cx="945" cy="21" r="5" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="958" y="25" font-family="Consolas, monospace" font-size="12" fill="#22d3ee">LIVE</text>
    </g>

    <!-- left: identity block -->
    <g font-family="Consolas, 'Courier New', monospace">
      <text x="28" y="82" font-size="13" fill="#475569">target ></text>
      <text x="105" y="82" font-size="13" fill="#e2e8f0" font-weight="bold" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.5s" fill="freeze"/>
        Kito
      </text>

      <text x="28" y="108" font-size="13" fill="#475569">role &#160;&#160;>&#160;</text>
      <text x="105" y="108" font-size="13" fill="#cbd5e1" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.5s" fill="freeze"/>
        CyberSecurity Student
      </text>

      <text x="28" y="134" font-size="13" fill="#475569">focus &#160;>&#160;</text>
      <text x="105" y="134" font-size="13" fill="#cbd5e1" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.5s" fill="freeze"/>
        Offensive Security / Pentesting
      </text>

      <text x="28" y="160" font-size="13" fill="#475569">base &#160;&#160;>&#160;</text>
      <text x="105" y="160" font-size="13" fill="#cbd5e1" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.5s" fill="freeze"/>
        recon &#183; exploitation &#183; reporting
      </text>
    </g>

    <!-- scan progress -->
    <g transform="translate(28,190)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.5s" fill="freeze"/>
      <text x="0" y="0" font-family="Consolas, monospace" font-size="12" fill="#475569">enumerating targets...</text>
      <rect x="0" y="12" width="360" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="12" width="0" height="6" rx="3" fill="#22d3ee">
        <animate attributeName="width" from="0" to="360" begin="1.6s" dur="2.4s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1"/>
      </rect>
      <text x="368" y="18" font-family="Consolas, monospace" font-size="11" fill="#22d3ee" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.9s" dur="0.4s" fill="freeze"/>
        100%
      </text>
    </g>

    <!-- right: findings panel -->
    <g transform="translate(640,60)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.6s" fill="freeze"/>
      <rect width="332" height="162" rx="10" fill="#0d1420" stroke="#1f2937" stroke-width="1"/>
      <text x="18" y="28" font-family="Consolas, monospace" font-size="12" fill="#64748b" letter-spacing="1">FOCUS AREAS</text>
      <line x1="18" y1="38" x2="314" y2="38" stroke="#1f2937"/>

      <g font-family="Consolas, monospace" font-size="12.5">
        <g transform="translate(18,60)">
          <circle cx="4" cy="-4" r="3" fill="#22d3ee"/>
          <text x="16" y="0" fill="#cbd5e1">Attack-surface recon tooling</text>
        </g>
        <g transform="translate(18,86)">
          <circle cx="4" cy="-4" r="3" fill="#22d3ee"/>
          <text x="16" y="0" fill="#cbd5e1">OWASP-based vuln scanning</text>
        </g>
        <g transform="translate(18,112)">
          <circle cx="4" cy="-4" r="3" fill="#22d3ee"/>
          <text x="16" y="0" fill="#cbd5e1">Hack The Box write-ups</text>
        </g>
        <g transform="translate(18,138)">
          <circle cx="4" cy="-4" r="3" fill="#facc15"/>
          <text x="16" y="0" fill="#cbd5e1">Learning: AD &#38; Burp Suite</text>
        </g>
      </g>
    </g>

    <rect x="0" y="0" width="1000" height="2" fill="#22d3ee" opacity="0.5"/>
    <rect x="0" y="258" width="1000" height="2" fill="#22d3ee" opacity="0.5"/>
  </g>
</svg>
