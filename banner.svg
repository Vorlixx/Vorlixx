<text x="930" y="-160" opacity="0.15" style="animation:rain 11s linear infinite;animation-delay:-0.8s"><tspan x="930" y="-160">$</tspan><tspan x="930" y="-145">;</tspan><tspan x="930" y="-130">1</tspan><tspan x="930" y="-115">&lt;</tspan><tspan x="930" y="-100">0</tspan><tspan x="930" y="-85">}</tspan><tspan x="930" y="-70">#</tspan><tspan x="930" y="-55">1</tspan><tspan x="930" y="-40">/</tspan><tspan x="930" y="-25">&gt;</tspan></text>
