<clipPath id="tclip"><rect x="266" y="170" width="0" height="36">
<animate attributeName="width" values="0;0;478;478;0" keyTimes="0;0.05;0.46;0.9;1" dur="8s" repeatCount="indefinite"/>
</rect></clipPath>
<style>
.rain{animation-name:rain;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes rain{from{transform:translateY(-360px)}to{transform:translateY(360px)}}
.floorh{animation:floor 1.6s linear infinite}
@keyframes floor{from{transform:translateY(0)}to{transform:translateY(13px)}}
.scan{animation:scan 5.5s linear infinite}
@keyframes scan{from{transform:translateY(-6px)}to{transform:translateY(306px)}}
.band{animation:scan 9s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.9}50%{opacity:0.35}}
.gC{animation:glc 3.1s steps(1) infinite}
@keyframes glc{0%,88%,100%{transform:translate(-3px,0)}90%{transform:translate(-6px,2px)}93%{transform:translate(-1px,-2px)}96%{transform:translate(-4px,1px)}}
.gR{animation:glr 4.3s steps(1) infinite}
@keyframes glr{0%,84%,100%{transform:translate(3px,0)}87%{transform:translate(6px,-2px)}91%{transform:translate(1px,2px)}95%{transform:translate(4px,-1px)}}
.base{animation:flick 4s steps(1) infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:0.72}95%{opacity:1}97%{opacity:0.86}}
.cur{animation:cur 1.05s steps(1) infinite}
@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
</defs>
